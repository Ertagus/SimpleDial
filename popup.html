<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title data-i18n="popupTitle">Dial a number</title>
<style>
  :root {
    --bg: #1a1d23; --card: #22262e; --border: #333944;
    --text: #e4e7ec; --muted: #8b93a1; --accent: #4a9eff;
    --green: #3fb950; --red: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 260px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px; padding: 14px;
  }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; background: var(--card);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 15px; padding: 9px 11px;
    outline: none; font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none;
    border-radius: 6px; padding: 9px 14px; font-size: 13px;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  button:hover { filter: brightness(1.1); }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.5; margin-top: 9px; }
  .hint.warn { color: #d29922; }
</style>
</head>
<body>
  <div class="row">
    <input type="text" id="num" inputmode="tel" autocomplete="off"
           spellcheck="false" placeholder="+1 555 010 1234"
           data-i18n-placeholder="testPlaceholder">
    <button id="call" data-i18n="popupCall">Call</button>
  </div>
  <div class="hint" id="hint" data-i18n="popupHint">
    Leave the field empty to just open the phone application.
  </div>
  <script src="popup.js"></script>
</body>
</html>
